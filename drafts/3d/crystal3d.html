<!doctype html>
<html><head><meta charset="utf-8"><title>Crystal 3D</title>
<style>html,body{margin:0;background:#020604;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const P = new URLSearchParams(location.search);
const THEMES = {
  gruen: {body:'#06200f', vein:'#4dff6a', edge:'#9dffb0', bg:'#020a05', light:0x40ff70},
  lila:  {body:'#14062a', vein:'#d45cff', edge:'#f0b8ff', bg:'#07030f', light:0xc050ff},
  blau:  {body:'#04122a', vein:'#4fc8ff', edge:'#c0ecff', bg:'#02060f', light:0x40a0ff},
  rot:   {body:'#2a0408', vein:'#ff4d5e', edge:'#ffc0c8', bg:'#0a0203', light:0xff4050},
  weiss: {body:'#101014', vein:'#ffffff', edge:'#ffffff', bg:'#030304', light:0xffffff},
};
const T = THEMES[P.get('theme') || 'gruen'];
const ITEM = P.get('item') || 'wings';
const W = 900, H = 900;
const yaw = +(P.get('yaw') || 200) * Math.PI / 180, pitch = +(P.get('pitch') || 10) * Math.PI / 180;
const dist = +(P.get('dist') || 10);
const ty = +(P.get('ty') || 1.4);

const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setSize(W, H); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.9;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(T.bg);
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
const target = new THREE.Vector3(0, ty, 0);
cam.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, ty + Math.sin(pitch) * dist, Math.cos(yaw) * Math.cos(pitch) * dist);
cam.lookAt(target);
scene.add(new THREE.AmbientLight(0xffffff, .25));
const k = new THREE.DirectionalLight(0xffffff, 1.4); k.position.set(2, 5, -4); scene.add(k);
const k2 = new THREE.DirectionalLight(0xffffff, .6); k2.position.set(-3, 3, 4); scene.add(k2);
const pl = new THREE.PointLight(T.light, 8, 8); pl.position.set(0, 2.2, -1.5); scene.add(pl);

function rnd(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

// ---------- Adern-Textur (Voronoi-Risse) ----------
function veinTexture(seed, n = 26, size = 256) {
  const r = rnd(seed); const pts = [];
  for (let i = 0; i < n; i++) pts.push([r() * size, r() * size]);
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); const img = g.createImageData(size, size);
  const vc = new THREE.Color(T.vein);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    let d1 = 1e9, d2 = 1e9;
    for (const [px, py] of pts) {
      for (const ox of [-size, 0, size]) for (const oy of [-size, 0, size]) {
        const dx = x - px - ox, dy = y - py - oy, d = Math.sqrt(dx * dx + dy * dy);
        if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) d2 = d;
      }
    }
    const e = d2 - d1;
    const v = Math.exp(-e / 1.6) + 0.35 * Math.exp(-e / 7);
    const i = (y * size + x) * 4;
    img.data[i] = Math.min(255, vc.r * 255 * v + 255 * Math.max(0, v - 1.0) * .6);
    img.data[i + 1] = Math.min(255, vc.g * 255 * v + 255 * Math.max(0, v - 1.0) * .6);
    img.data[i + 2] = Math.min(255, vc.b * 255 * v + 255 * Math.max(0, v - 1.0) * .6);
    img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
const VEINS = [veinTexture(3), veinTexture(17), veinTexture(41)];

function crystalMat(i, glow = 1.6, rep = 1) {
  const t = VEINS[i % 3].clone(); t.needsUpdate = true; t.repeat.set(rep, rep);
  return new THREE.MeshPhysicalMaterial({color: T.body, emissive: 0xffffff, emissiveMap: t, emissiveIntensity: glow,
    roughness: .12, metalness: .2, clearcoat: 1, transparent: true, opacity: .93, flatShading: true, side: THREE.DoubleSide});
}

// ---------- Kristallsplitter ----------
function shard(len, rad, seed, glow = 1.6) {
  const r = rnd(seed);
  const geo = new THREE.ConeGeometry(rad, len, 5, 3);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i);
    if (y < len / 2 - 1e-3) {  // Spitze bleibt spitz
      p.setX(i, p.getX(i) * (0.75 + r() * .5)); p.setZ(i, p.getZ(i) * (0.35 + r() * .2));
      p.setY(i, y + (r() - .5) * len * .06);
    }
  }
  geo.translate(0, len / 2, 0); geo.computeVertexNormals();
  const g = new THREE.Group();
  const m = new THREE.Mesh(geo, crystalMat(seed, glow));
  g.add(m);
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25),
    new THREE.LineBasicMaterial({color: T.edge, transparent: true, opacity: .55}));
  g.add(edges);
  return g;
}

// ---------- Fluegel: Splitter wie Flammen nach oben/aussen ----------
function crystalWing(side) {
  const root = new THREE.Group(); const r = rnd(side > 0 ? 7 : 13);
  const N = 15;
  for (let i = 0; i < N; i++) {
    const s = i / (N - 1);
    const ang = (12 + 70 * s) * Math.PI / 180;                 // 0 = senkrecht hoch
    const len = (0.55 + 1.15 * Math.sin(Math.PI * (0.15 + s * .75))) * (0.85 + r() * .3);
    const base = new THREE.Vector3(side * (0.08 + 0.55 * s), 0.25 * Math.sin(s * Math.PI) - 0.15 * s, -0.08 * s);
    const sh = shard(len, 0.11 + .05 * r(), 100 + i + (side > 0 ? 0 : 50));
    sh.position.copy(base);
    sh.rotation.z = -side * ang; sh.rotation.x = -0.25 - r() * .15; sh.rotation.y = (r() - .5) * .6;
    root.add(sh);
    if (i % 2 === 0) {                                          // kleine Nebensplitter
      const sub = shard(len * .45, 0.07, 300 + i, 2.0);
      sub.position.set(base.x + side * Math.sin(ang) * len * .45, base.y + Math.cos(ang) * len * .45, base.z);
      sub.rotation.z = -side * (ang + .5); sub.rotation.x = -.3;
      root.add(sub);
    }
  }
  // Kern an der Schulter
  const core = shard(.35, .14, 999, 2.4); core.rotation.z = -side * .9; root.add(core);
  return root;
}

// ---------- Schild ----------
function crystalShield() {
  const s = new THREE.Shape(); const w = .55, h = .7;
  s.moveTo(-w, h * .5); s.quadraticCurveTo(0, h * .62, w, h * .5);
  s.bezierCurveTo(w * 1.02, -h * .1, w * .55, -h * .45, 0, -h * .75);
  s.bezierCurveTo(-w * .55, -h * .45, -w * 1.02, -h * .1, -w, h * .5);
  const geo = new THREE.ExtrudeGeometry(s, {depth: .08, bevelEnabled: true, bevelThickness: .05, bevelSize: .05, bevelSegments: 3, curveSegments: 24});
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) uv.setXY(i, pos.getX(i) * .9 + .5, pos.getY(i) * .9 + .5);
  geo.computeVertexNormals();
  const g = new THREE.Group();
  const mat = crystalMat(1, 1.8, 1); mat.flatShading = false;
  g.add(new THREE.Mesh(geo, mat));
  const pts = s.getPoints(80).map(p => new THREE.Vector3(p.x * 1.04, p.y * 1.04, .1));
  g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, true), 160, .022, 8, true),
    new THREE.MeshStandardMaterial({color: T.edge, emissive: T.vein, emissiveIntensity: 2.2})));
  // Kristall in der Mitte
  const c = shard(.42, .14, 77, 2.6); c.position.set(0, -.22, .14); g.add(c);
  // kleine Kristallfluegel am Schild
  for (const side of [-1, 1]) {
    for (let i = 0; i < 6; i++) {
      const a = (25 + i * 11) * Math.PI / 180;
      const sh = shard(.35 + .28 * Math.sin(i / 5 * Math.PI), .06, 500 + i * 3 + (side > 0 ? 0 : 40), 1.8);
      sh.position.set(side * .48, .18, -.02); sh.rotation.z = -side * a; sh.rotation.x = -.2;
      g.add(sh);
    }
  }
  return g;
}

// ---------- Krone ----------
function crystalCrown() {
  const g = new THREE.Group();
  const band = new THREE.Mesh(new THREE.CylinderGeometry(.3, .3, .09, 8, 1, true), crystalMat(2, 1.6, 2));
  band.rotation.y = Math.PI / 8; g.add(band);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(.305, .014, 6, 8), new THREE.MeshStandardMaterial({color: T.edge, emissive: T.vein, emissiveIntensity: 2}));
  ring.rotation.x = Math.PI / 2; ring.rotation.z = Math.PI / 8; ring.position.y = .045; g.add(ring);
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * Math.PI * 2;
    const big = i % 2 === 0; const front = i === 0;
    const sh = shard(front ? .42 : big ? .3 : .19, front ? .075 : .055, 700 + i, front ? 2.6 : 1.9);
    sh.position.set(Math.sin(a) * .28, .04, Math.cos(a) * .28);
    sh.rotation.y = a; sh.rotation.x = -.18;
    g.add(sh);
  }
  return g;
}

// ---------- Spieler ----------
const px = 1 / 16;
function box(w, h, d, color, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({color, roughness: .9}));
  m.position.set(x, y, z); scene.add(m); return m;
}
function player() {
  box(8 * px, 8 * px, 8 * px, '#1a1a22', 0, 28 * px, 0);
  box(8 * px, 12 * px, 4 * px, '#22222c', 0, 18 * px, 0);
  box(4 * px, 12 * px, 4 * px, '#22222c', -6 * px, 18 * px, 0);
  box(4 * px, 12 * px, 4 * px, '#22222c', 6 * px, 18 * px, 0);
  box(4 * px, 12 * px, 4 * px, '#14141a', -2 * px, 6 * px, 0);
  box(4 * px, 12 * px, 4 * px, '#14141a', 2 * px, 6 * px, 0);
  box(2 * px, 1 * px, .2 * px, '#e8fff0', -2 * px, 28 * px, 4.05 * px);
  box(2 * px, 1 * px, .2 * px, '#e8fff0', 2 * px, 28 * px, 4.05 * px);
}

if (ITEM === 'wings') {
  player();
  const w = new THREE.Group(); w.add(crystalWing(1)); w.add(crystalWing(-1));
  w.position.set(0, 22 * px, -2.8 * px); w.scale.setScalar(1.0); scene.add(w);
} else if (ITEM === 'shield') {
  const s = crystalShield(); s.position.set(0, ty, 0); s.scale.setScalar(1.6); scene.add(s);
} else if (ITEM === 'crown') {
  player();
  const c = crystalCrown(); c.position.set(0, 32.2 * px, 0); c.scale.setScalar(1.05); scene.add(c);
}

// Funken
const sg = new THREE.BufferGeometry(); const sp = []; const r0 = rnd(9);
for (let i = 0; i < 120; i++) sp.push((r0() - .5) * 6, r0() * 4, (r0() - .5) * 6 - 1);
sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
scene.add(new THREE.Points(sg, new THREE.PointsMaterial({color: T.vein, size: .025})));

const comp = new EffectComposer(renderer);
comp.addPass(new RenderPass(scene, cam));
comp.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.7, 0.45, 0.4));
comp.addPass(new OutputPass());
comp.render();
window.__done = true;
</script></body></html>
