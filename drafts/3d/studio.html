<title>McBen Cosmetics Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Buehne (3D) links gross, Auswahl-Panel rechts; auf dem Handy untereinander. Einheitlich dunkler Look. */
:root{
  --bg:#08050e; --panel:#120c1d; --panel-2:#1a1228; --line:#2c2140; --text:#efe8fa; --muted:#9a8cb3;
  --accent:#c45cff; --accent-2:#ff6cf5;
  --font-display:"Sora", "Segoe UI", system-ui, sans-serif; --font-body:"Inter", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;gap:12px;box-sizing:border-box}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:.2px}
header h1 b{background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:0;color:var(--muted);font-size:13px}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px}
#stage{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#000;min-height:320px}
#stage canvas{width:100%!important;height:100%!important;display:block;touch-action:none}
#label{position:absolute;left:16px;top:14px;pointer-events:none}
#label small{color:var(--muted);font-size:12px;letter-spacing:1px;text-transform:uppercase}
#label div{font-family:var(--font-display);font-size:22px;font-weight:700;margin-top:2px}
#hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:12px;color:var(--muted);background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:999px;padding:6px 14px;white-space:nowrap}
aside{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:16px;overflow:auto;min-width:0}
h2{margin:0;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button,.variants button{font:inherit;color:var(--text);background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:linear-gradient(90deg,var(--accent),var(--accent-2));border-color:transparent;font-weight:700}
.variants{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.variants button{text-align:left;padding:10px 12px;line-height:1.25}
.variants button small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.variants button[aria-pressed="true"]{border:2px solid var(--accent);box-shadow:0 0 14px rgba(196,92,255,.45);padding:9px 11px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{width:34px;height:34px;border-radius:10px;border:2px solid transparent;cursor:pointer}
.chips button[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 10px rgba(255,255,255,.5)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row label{cursor:pointer}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
input[type=range]{width:150px;accent-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.note{color:var(--muted);font-size:12px;line-height:1.5;margin:0}
body.shot #app{padding:0}body.shot header,body.shot aside,body.shot #hint,body.shot #label{display:none}
body.shot main{display:block}body.shot #stage{border:0;border-radius:0;position:fixed;inset:0}
@media (max-width:820px){main{grid-template-columns:1fr;grid-template-rows:minmax(320px,55vh) auto}#app{height:auto;min-height:100%}}
@media (prefers-reduced-motion:reduce){#hint{display:none}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sora:wght@600;700&display=swap">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

<div id="app">
  <header><h1><b>McBen</b> Cosmetics Studio</h1><p>Entwurf · Ziehen zum Drehen, Mausrad/zwei Finger zum Zoomen</p></header>
  <main>
    <div id="stage"><div id="label"><small id="lblCat">Flügel</small><div id="lblName">–</div></div><div id="hint">⟲ Ziehen zum Drehen</div></div>
    <aside>
      <section><h2>Kategorie</h2><div class="tabs" id="tabs"></div></section>
      <section><h2>Variante</h2><div class="variants" id="variants"></div></section>
      <section><h2>Farbe</h2><div class="chips" id="chips"></div></section>
      <section>
        <h2>Ansicht</h2>
        <div class="row"><label for="optPlayer">Spieler anzeigen</label><input type="checkbox" id="optPlayer" checked></div>
        <div class="row"><label for="optSpin">Automatisch drehen</label><input type="checkbox" id="optSpin" checked></div>
        <div class="row"><label for="optAnim">Animation</label><input type="checkbox" id="optAnim" checked></div>
        <div class="row"><label for="optGlow">Leuchtstärke</label><input type="range" id="optGlow" min="0.2" max="2" step="0.05" value="1"></div>
      </section>
      <p class="note">Platzhalter-Skin. In der Mod nimmt das Plushie automatisch deinen eigenen Skin.</p>
    </aside>
  </main>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ============================================================ Themes
const THEMES = {
  lila:  {name:'Lila',  deep:'#08030f', body:'#16072c', mid:'#3a1270', main:'#a03cf0', vein:'#d45cff', tip:'#ff6cf5', edge:'#f0b8ff', light:'#ffd6ff', bg:'#07030f', chip:'linear-gradient(135deg,#7a2ae0,#ff6cf5)'},
  gruen: {name:'Grün',  deep:'#020a05', body:'#06200f', mid:'#0d4a24', main:'#22c55e', vein:'#4dff6a', tip:'#b0ff8a', edge:'#c8ffd4', light:'#e6ffe9', bg:'#020a05', chip:'linear-gradient(135deg,#0f6a30,#7fffb0)'},
  blau:  {name:'Blau',  deep:'#02060f', body:'#04122a', mid:'#0f2f66', main:'#2f7cf0', vein:'#4fc8ff', tip:'#8fe8ff', edge:'#c0ecff', light:'#e0f6ff', bg:'#02060f', chip:'linear-gradient(135deg,#0f3fa0,#7fe0ff)'},
  rot:   {name:'Rot',   deep:'#0a0203', body:'#2a0408', mid:'#5a0d18', main:'#e0263c', vein:'#ff4d5e', tip:'#ffa06c', edge:'#ffc0c8', light:'#ffe0e4', bg:'#0a0203', chip:'linear-gradient(135deg,#7a0f20,#ff6c80)'},
  weiss: {name:'Dark Edition', deep:'#030304', body:'#121216', mid:'#2a2a33', main:'#9a9aa8', vein:'#ffffff', tip:'#ffffff', edge:'#ffffff', light:'#ffffff', bg:'#040405', chip:'linear-gradient(135deg,#111,#eee)'},
  gold:  {name:'Gold',  deep:'#0a0702', body:'#2a1c04', mid:'#5a3c0a', main:'#e0a020', vein:'#ffd04d', tip:'#fff0a0', edge:'#fff2c0', light:'#fff8e0', bg:'#0a0702', chip:'linear-gradient(135deg,#8a5a0a,#ffe08a)'},
};
let T = THEMES.lila;

// ============================================================ Helfer
const px = 1 / 16;
function rnd(seed) { let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const cache = new Map();
function cached(key, fn) { const k = key + '|' + T.name; if (!cache.has(k)) cache.set(k, fn()); return cache.get(k); }
function canvasTex(c, opts = {}) {
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  if (opts.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  if (opts.nearest) { t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; }
  t.anisotropy = 4; return t;
}
function hexA(hex, a) { const c = new THREE.Color(hex); return `rgba(${c.r * 255 | 0},${c.g * 255 | 0},${c.b * 255 | 0},${a})`; }

// ---------- Texturen ----------
function veinCanvas(seed, n = 26, size = 256, color = null) {
  const r = rnd(seed); const pts = [];
  for (let i = 0; i < n; i++) pts.push([r() * size, r() * size]);
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); const img = g.createImageData(size, size);
  const vc = new THREE.Color(color || T.vein);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    let d1 = 1e9, d2 = 1e9;
    for (const [qx, qy] of pts) for (const ox of [-size, 0, size]) for (const oy of [-size, 0, size]) {
      const dx = x - qx - ox, dy = y - qy - oy, d = dx * dx + dy * dy;
      if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) d2 = d;
    }
    const e = Math.sqrt(d2) - Math.sqrt(d1);
    const v = Math.exp(-e / 1.6) + 0.35 * Math.exp(-e / 7);
    const i = (y * size + x) * 4, w = Math.max(0, v - 1) * 150;
    img.data[i] = Math.min(255, vc.r * 255 * v + w); img.data[i + 1] = Math.min(255, vc.g * 255 * v + w);
    img.data[i + 2] = Math.min(255, vc.b * 255 * v + w); img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0); return c;
}
const veinTex = (seed, rep = 1) => cached('vein' + seed + 'r' + rep, () => { const t = canvasTex(veinCanvas(seed), {repeat: true}); t.repeat.set(rep, rep); return t; });

function nebula(g, w, h, seed, strength = 1) {
  const r = rnd(seed);
  g.fillStyle = T.deep; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 70; i++) {
    const x = r() * w, y = r() * h, rad = (0.08 + r() * 0.3) * Math.max(w, h);
    const col = [T.mid, T.main, T.vein, T.body][i % 4];
    const rg = g.createRadialGradient(x, y, 0, x, y, rad);
    rg.addColorStop(0, hexA(col, (0.16 + r() * 0.22) * strength)); rg.addColorStop(1, hexA(col, 0));
    g.fillStyle = rg; g.fillRect(0, 0, w, h);
  }
}
function stars(g, w, h, seed, n = 90, big = 6) {
  const r = rnd(seed);
  for (let i = 0; i < n; i++) {
    const x = r() * w, y = r() * h, s = r() < .15 ? 2 : 1;
    g.fillStyle = r() < .7 ? '#ffffff' : T.light; g.beginPath(); g.arc(x, y, s, 0, 7); g.fill();
  }
  for (let i = 0; i < big; i++) sparkle(g, r() * w, r() * h, 6 + r() * 10);
}
function sparkle(g, x, y, s) {
  const rg = g.createRadialGradient(x, y, 0, x, y, s * 1.6);
  rg.addColorStop(0, 'rgba(255,255,255,.9)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = rg; g.fillRect(x - s * 2, y - s * 2, s * 4, s * 4);
  g.fillStyle = '#fff'; g.beginPath();
  g.moveTo(x, y - s); g.lineTo(x + s * .2, y - s * .2); g.lineTo(x + s, y); g.lineTo(x + s * .2, y + s * .2);
  g.lineTo(x, y + s); g.lineTo(x - s * .2, y + s * .2); g.lineTo(x - s, y); g.lineTo(x - s * .2, y - s * .2); g.fill();
}
function galaxyCanvas(seed, w = 512, h = 512, paint = null) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  nebula(g, w, h, seed); stars(g, w, h, seed + 1, Math.round(w * h / 2600), 5);
  if (paint) paint(g, w, h);
  return c;
}
const galaxyTex = (seed, w, h, paint, key = '') => cached('gal' + seed + key + w + 'x' + h, () => canvasTex(galaxyCanvas(seed, w, h, paint)));

// ---------- Materialien ----------
function crystalMat(seed, glow = 1.6, rep = 1) {
  return new THREE.MeshPhysicalMaterial({color: T.body, emissive: 0xffffff, emissiveMap: veinTex(seed % 3, rep), emissiveIntensity: glow,
    roughness: .12, metalness: .2, clearcoat: 1, transparent: true, opacity: .93, flatShading: true, side: THREE.DoubleSide});
}
const glowMat = (col, k = 2) => new THREE.MeshStandardMaterial({color: col, emissive: col, emissiveIntensity: k, roughness: .3});
function galaxyMat(tex, glow = .55, extra = {}) {
  return new THREE.MeshStandardMaterial({map: tex, emissiveMap: tex, emissive: 0xffffff, emissiveIntensity: glow, roughness: .35, metalness: .2, ...extra});
}
const goldMat = () => new THREE.MeshStandardMaterial({color: '#e8b23a', metalness: 1, roughness: .25, emissive: '#3a2400', emissiveIntensity: .4});

// ---------- Kristallsplitter ----------
function shard(len, rad, seed, glow = 1.6, sides = 5) {
  const r = rnd(seed + 7);
  const geo = new THREE.ConeGeometry(rad, len, sides, 3);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i);
    if (y < len / 2 - 1e-3) { p.setX(i, p.getX(i) * (0.75 + r() * .5)); p.setZ(i, p.getZ(i) * (0.4 + r() * .2)); p.setY(i, y + (r() - .5) * len * .05); }
  }
  geo.translate(0, len / 2, 0); geo.computeVertexNormals();
  const g = new THREE.Group();
  g.add(new THREE.Mesh(geo, crystalMat(seed, glow)));
  g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), new THREE.LineBasicMaterial({color: T.edge, transparent: true, opacity: .5})));
  return g;
}

// ---------- Federn ----------
function featherCanvas(seed, angel = false) {
  const c = document.createElement('canvas'); c.width = 128; c.height = 512; const g = c.getContext('2d'); const r = rnd(seed);
  const grad = g.createLinearGradient(0, 0, 0, 512);
  if (angel) { grad.addColorStop(0, '#d8d0e6'); grad.addColorStop(.6, '#ffffff'); grad.addColorStop(1, T.light); }
  else { grad.addColorStop(0, T.deep); grad.addColorStop(.35, T.mid); grad.addColorStop(.75, T.main); grad.addColorStop(1, T.tip); }
  g.fillStyle = grad; g.fillRect(0, 0, 128, 512);
  for (let i = 0; i < 36; i++) {
    const x = r() * 128, y = r() * 512, rad = 20 + r() * 60, rg = g.createRadialGradient(x, y, 0, x, y, rad);
    rg.addColorStop(0, angel ? 'rgba(200,190,230,.25)' : hexA(r() < .5 ? T.main : T.deep, .45)); rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rg; g.fillRect(0, 0, 128, 512);
  }
  g.strokeStyle = angel ? 'rgba(150,140,180,.6)' : hexA(T.light, .45); g.lineWidth = 2;
  g.beginPath(); g.moveTo(64, 0); g.lineTo(64, 470); g.stroke();
  g.strokeStyle = angel ? 'rgba(150,140,180,.25)' : hexA(T.light, .18); g.lineWidth = 1;
  for (let y = 20; y < 480; y += 9) { g.beginPath(); g.moveTo(64, y); g.lineTo(4, y + 26); g.moveTo(64, y); g.lineTo(124, y + 26); g.stroke(); }
  if (!angel) for (let i = 0; i < 16; i++) { g.fillStyle = '#fff'; g.beginPath(); g.arc(10 + r() * 108, 60 + r() * 440, r() < .2 ? 3 : 1.5, 0, 7); g.fill(); }
  return c;
}
function featherGlowCanvas(seed) {
  const c = document.createElement('canvas'); c.width = 128; c.height = 512; const g = c.getContext('2d'); const r = rnd(seed + 99);
  const grad = g.createLinearGradient(0, 0, 0, 512); grad.addColorStop(0, '#000'); grad.addColorStop(.6, '#000'); grad.addColorStop(1, T.tip);
  g.fillStyle = grad; g.fillRect(0, 0, 128, 512);
  for (let i = 0; i < 10; i++) { g.fillStyle = '#fff'; g.beginPath(); g.arc(10 + r() * 108, 60 + r() * 440, 2.5, 0, 7); g.fill(); }
  return c;
}
function featherShape(len, wid) {
  const s = new THREE.Shape();
  s.moveTo(-wid * .18, 0);
  s.bezierCurveTo(-wid * .55, -len * .15, -wid * .55, -len * .65, -wid * .2, -len * .95);
  s.quadraticCurveTo(0, -len * 1.04, wid * .2, -len * .95);
  s.bezierCurveTo(wid * .55, -len * .65, wid * .55, -len * .15, wid * .18, 0);
  s.lineTo(-wid * .18, 0); return s;
}
function featherGeo(len, wid) {
  const geo = new THREE.ExtrudeGeometry(featherShape(len, wid), {depth: .012, bevelEnabled: true, bevelThickness: .012, bevelSize: .01, bevelSegments: 2, curveSegments: 10});
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) { uv.setXY(i, pos.getX(i) / (wid * 1.2) + .5, 1 + pos.getY(i) / len); pos.setZ(i, pos.getZ(i) - .006 - .12 * pos.getY(i) * pos.getY(i)); }
  geo.computeVertexNormals(); return geo;
}
function featherMesh(len, wid, seed, glow, style) {
  if (style === 'neon') {
    const pts = featherShape(len, wid).getPoints(40).map(p => new THREE.Vector3(p.x, p.y, -.12 * p.y * p.y));
    const g = new THREE.Group();
    g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color: T.tip})));
    g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, -len * .85, -.12 * len * len * .7)]), new THREE.LineBasicMaterial({color: T.vein, transparent: true, opacity: .6})));
    const fill = new THREE.Mesh(featherGeo(len, wid), new THREE.MeshBasicMaterial({color: T.main, transparent: true, opacity: .12, side: THREE.DoubleSide, depthWrite: false}));
    g.add(fill); return g;
  }
  const angel = style === 'engel';
  const mat = new THREE.MeshStandardMaterial({
    map: cached('fe' + (seed % 9) + angel, () => canvasTex(featherCanvas(seed % 9, angel))),
    emissiveMap: cached('fg' + (seed % 9), () => canvasTex(featherGlowCanvas(seed % 9))), emissive: 0xffffff,
    emissiveIntensity: angel ? glow * .6 : glow, roughness: .45, metalness: angel ? 0 : .25, side: THREE.DoubleSide});
  return new THREE.Mesh(featherGeo(len, wid), mat);
}
function featherWing(side, style = 'galaxie', spread = .82) {
  const root = new THREE.Group(); const pts = [];
  for (let i = 0; i <= 12; i++) { const s = i / 12; pts.push(new THREE.Vector3(side * (.12 + 1.55 * s * spread), .95 * Math.sin(s * Math.PI * .62) * spread, -.35 * s)); }
  const curve = new THREE.CatmullRomCurve3(pts);
  root.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 40, .045, 8), style === 'engel'
    ? new THREE.MeshStandardMaterial({color: '#ffffff', emissive: T.tip, emissiveIntensity: .6}) : glowMat(T.tip, 1.1)));
  let seed = side > 0 ? 11 : 77;
  const rows = [[11, .22, 1, s => .85 + .75 * s, .30, s => -8 + 62 * s, -.035, .55], [10, .04, .86, s => .62 + .3 * s, .30, s => -14 + 52 * s, 0, .3], [12, 0, .92, s => .3 + .08 * s, .26, s => -20 + 45 * s, .035, .15]];
  for (const [n, s0, s1, L, wd, A, dz, gl] of rows) for (let i = 0; i < n; i++) {
    const s = s0 + (s1 - s0) * i / (n - 1), p = curve.getPoint(s);
    const f = featherMesh(L(s) * spread, wd * spread, seed++, gl, style);
    f.position.set(p.x, p.y, p.z + dz); f.rotation.z = side * A(s) * Math.PI / 180; f.rotation.x = .18; root.add(f);

}

// ============================================================ FLUEGEL
function crystalFeatherWing(side) {
  const root = new THREE.Group(); const pts = []; const r = rnd(side > 0 ? 21 : 37);
  for (let i = 0; i <= 12; i++) { const s = i / 12; pts.push(new THREE.Vector3(side * (.12 + 1.3 * s), .85 * Math.sin(s * Math.PI * .62), -.3 * s)); }
  const curve = new THREE.CatmullRomCurve3(pts);
  root.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 40, .05, 6), crystalMat(2, 2.2)));
  const rows = [[12, .2, 1, s => .8 + .7 * s, .11, s => -5 + 60 * s, -.04], [10, .03, .85, s => .55 + .3 * s, .1, s => -12 + 50 * s, 0], [12, 0, .92, s => .28 + .1 * s, .09, s => -18 + 45 * s, .04]];
  let seed = side > 0 ? 400 : 600;
  for (const [n, s0, s1, L, rad, A, dz] of rows) for (let i = 0; i < n; i++) {
    const s = s0 + (s1 - s0) * i / (n - 1), p = curve.getPoint(s);
    const sh = shard(L(s) * (.9 + r() * .2), rad, seed++, 1.7);
    sh.position.set(p.x, p.y, p.z + dz); sh.rotation.z = Math.PI + side * A(s) * Math.PI / 180; sh.rotation.x = -.15; sh.rotation.y = (r() - .5) * .5;
    root.add(sh);
  }
  return root;
}
function crystalFlameWing(side) {
  const root = new THREE.Group(); const r = rnd(side > 0 ? 7 : 13); const N = 15;
  for (let i = 0; i < N; i++) {
    const s = i / (N - 1), ang = (12 + 70 * s) * Math.PI / 180;
    const len = (.55 + 1.15 * Math.sin(Math.PI * (.15 + s * .75))) * (.85 + r() * .3);
